[package]
name = "sonic-server"
version = "1.8.1"
description = "Fast, lightweight and schema-less search backend."
readme = "../README.md"
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
keywords = ["search", "query", "server", "index"]
categories = ["database-implementations", "web-programming"]
authors = { workspace = true }

[[bin]]
name = "sonic"
path = "src/main.rs"
doc = false

[dependencies]
sonic-core = { version = "=0.2.1", path = "../core", default-features = false, features = ["stemming"] }
tracing = { version = "=0.1.44", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
clap = { version = "=4.6.6", default-features = false, features = ["std", "cargo", "color", "help", "usage", "error-context", "suggestions"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "rc"] }
rand = { version = "=0.10.2", default-features = false, features = ["std", "thread_rng"] }
hashbrown = { version = "=0.17.1", default-features = false, features = ["default-hasher", "allocator-api2", "inline-more"] }
config = { version = "=0.15.25", default-features = false, features = ["toml"] }

[dev-dependencies]
# Benchmarking dependencies.
arrow-array = { version = "=59.2.0", default-features = false }
bus = { version = "=2.4.1", default-features = false }
criterion = { version = "=0.8.2", default-features = false, features = ["html_reports", "plotters"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq"] }
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sonic_client = { version = "=0.4.0", path = "../client", features = ["sync", "tracing", "raw-api"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
tikv-jemallocator = { optional = true, version = "=0.7.0", default-features = false, features = ["background_threads_runtime_support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_System_Console"] }

[features]
default = ["allocator-jemalloc", "tokenizer-chinese"]
allocator-jemalloc = ["tikv-jemallocator", "sonic-core/allocator-jemalloc"]
tokenizer-chinese = ["sonic-core/tokenizer-chinese"]
tokenizer-japanese = ["sonic-core/tokenizer-japanese"]
experimental-api = []
benchmark = []

[[bench]]
name = "wikipedia"
harness = false

[[bench]]
name = "beir_quora"
harness = false

[[bench]]
name = "parallelism"
harness = false
