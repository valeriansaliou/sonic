[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[advisories]
maximum-db-staleness = "P2W"
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2020-0077", reason = "`memmap` is unmaintained, but `fst` still depends on it and we can’t just bump" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "libssh2-sys", reason = "reduce supply-chain exposure" },
    { crate = "windows", reason = "bloated and unnecessary", use-instead = "ideally inline bindings; practically, windows-sys" },
]

[bans.build]
# WARN: Before updating this list, e.g. when bumping deps, you should have a
#   look at what has changed in the build script (to reduce the risk of
#   supply-chain attack).
allow-build-scripts = [
    "ahash@0.8.12",
    "alloca@0.4.0",
    "bindgen@0.72.1",
    "bzip2-sys@0.1.13+1.0.8",
    "clang-sys@1.9.1",
    "crc32fast@1.5.1",
    "crossbeam-utils@0.8.22",
    "crunchy@0.2.4",
    "flatbuffers@25.12.19",
    "getrandom@0.3.4",
    "getrandom@0.4.3",
    "httparse@1.10.1",
    "iana-time-zone-haiku@0.1.2",
    "libc@0.2.189",
    "libm@0.2.16",
    "librocksdb-sys@0.19.0+11.8.1",
    "libz-sys@1.1.29",
    "lz4-sys@1.11.1+lz4-1.10.0",
    "nix@0.31.3",
    "num-traits@0.2.19",
    "parking_lot_core@0.9.12",
    "paste@1.0.15",
    "portable-atomic@1.15.0",
    "proc-macro2@1.0.107",
    "quote@1.0.47",
    "ring@0.17.14",
    "rustls@0.23.43",
    "rustversion@1.0.23",
    "serde@1.0.229",
    "serde_core@1.0.229",
    "serde_json@1.0.151",
    "snap@1.1.2",
    "thiserror@2.0.20",
    "tikv-jemalloc-sys@0.7.1+5.3.1-0-g81034ce1f1373e37dc865038e1bc8eeecf559ce8",
    "tiny-keccak@2.0.2",
    "wasm-bindgen-shared@0.2.127",
    "wasm-bindgen@0.2.127",
    "winapi-i686-pc-windows-gnu@0.4.0",
    "winapi-x86_64-pc-windows-gnu@0.4.0",
    "winapi@0.3.9",
    "windows_aarch64_gnullvm@0.52.6",
    "windows_aarch64_msvc@0.52.6",
    "windows_i686_gnu@0.52.6",
    "windows_i686_gnullvm@0.52.6",
    "windows_i686_msvc@0.52.6",
    "windows_x86_64_gnu@0.52.6",
    "windows_x86_64_gnullvm@0.52.6",
    "windows_x86_64_msvc@0.52.6",
    "wit-bindgen@0.51.0",
    "wit-bindgen@0.57.1",
    "zerocopy@0.8.56",
    "zmij@1.0.23",
    "zstd-safe@7.2.4",
    "zstd-sys@2.0.16+zstd.1.5.7",
]
executables = "allow"
interpreted = "allow"
script-extensions = []
enable-builtin-globs = false
include-dependencies = false
include-workspace = false
include-archives = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
