# [normalization]
# unicode_normalization = "none"

[store.kv.database]
# Merge small-sized memtables into large L0 SSTs.
write_buffer_size = 8_192 # 8MiB
# NOTE: Merge operations have a ratio of roughly 4×.
# NOTE: ((4.4GiB/((256-48)/2))/8MiB)*4 ⪅ 22
min_write_buffer_number_to_merge = 22 # L0 SST ⪅ 1GiB
# min_write_buffer_number = 2
max_write_buffer_number = 44 # Do not stop writes while a flush is in progress (max 2GiB RAM usage).

# Allow RocksDB to use a total of 10 threads for background jobs.
parallelism = 10
max_background_jobs = 11
max_subcompactions = 10
# max_flushes = 2

write_ahead_log = false

# enable_blob_files = true
# min_blob_size = 2048 # 512 u32
# blob_file_size = 16_777_216 # 16MiB
# enable_blob_gc = true
# blob_compression_type = "none"

max_open_files = 20

# min_level_to_compress = 1
level_zero_compression_type = "lz4"

# log_level = "info"
# stats_dump_period_sec = 5
# db_log_dir = "/tmp/bench-logs"
# keep_log_file_num = 10
# max_log_file_size = 67_108_864 # 64MiB

[store.object.database]
# Merge medium-sized memtables into medium L0 SSTs.
write_buffer_size = 65_536 # 64MiB
min_write_buffer_number_to_merge = 4 # L0 SST ⪅ 256MiB
max_write_buffer_number = 8 # Do not stop writes while a flush is in progress (max 512MiB RAM usage).

# Allow RocksDB to use a total of 10 threads for background jobs.
parallelism = 10
max_background_jobs = 11
max_subcompactions = 10
# max_flushes = 2

write_ahead_log = false

# min_blob_size = 0
# blob_file_size = 134_217_728 # 128MiB
# blob_compression_type = "lz4"

max_open_files = 20

min_level_to_compress = 1
