[package]
name = "sonic-benchmarks"
version = "0.0.0"
description = "Benchmarks for Sonic, the fast, lightweight and schema-less search backend."
readme = "../README.md"
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
keywords = []
categories = []
authors = { workspace = true }
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[dev-dependencies]
arrow-array = { version = "=59.3.0", default-features = false }
bus = { version = "=2.4.1", default-features = false }
config = { version = "=0.15.25", default-features = false, features = ["toml"] }
criterion = { version = "=0.8.2", default-features = false, features = ["html_reports", "plotters"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq"] }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "snap"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sonic_client = { version = "=0.6.0", path = "../client", features = ["sync", "tracing", "raw-api", "experimental-api"] }
tracing = { version = "=0.1.44", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }

[[bench]]
name = "wikipedia"
harness = false

[[bench]]
name = "wikipedia_parallel"
harness = false

[[bench]]
name = "beir_quora"
harness = false

[[bench]]
name = "parallelism"
harness = false

[[bench]]
name = "index_size"
harness = false
