[store.kv.database]
# Merge medium-sized memtables into large L0 SSTs.
write_buffer_size = 16_384 # 16MiB
min_write_buffer_number_to_merge = 16 # L0 SST ≤ 256MiB
max_write_buffer_number = 64 # Do not stop writes while a flush is in progress (max 1GiB RAM usage).

# Compact less often (when there are 256 L0 SSTs).
level_zero_file_num_compaction_trigger = 256
level_zero_slowdown_writes_trigger = 384
level_zero_stop_writes_trigger = 512
# Default target_file_size_base = 64MiB
